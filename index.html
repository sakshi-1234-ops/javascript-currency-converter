<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>💱 Currency Converter</h1>

        <p class="subtitle">
            Convert currencies using live exchange rates
        </p>

        <label for="amount">
            Enter Amount
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
        >

        <label for="fromCurrency">
            From Currency
        </label>

        <select id="fromCurrency">

            <option value="USD">USD - US Dollar</option>

            <option value="INR">
                INR - Indian Rupee
            </option>

            <option value="EUR">
                EUR - Euro
            </option>

            <option value="GBP">
                GBP - British Pound
            </option>

            <option value="JPY">
                JPY - Japanese Yen
            </option>

            <option value="AUD">
                AUD - Australian Dollar
            </option>

            <option value="CAD">
                CAD - Canadian Dollar
            </option>

        </select>


        <label for="toCurrency">
            To Currency
        </label>

        <select id="toCurrency">

            <option value="INR">
                INR - Indian Rupee
            </option>

            <option value="USD">
                USD - US Dollar
            </option>

            <option value="EUR">
                EUR - Euro
            </option>

            <option value="GBP">
                GBP - British Pound
            </option>

            <option value="JPY">
                JPY - Japanese Yen
            </option>

            <option value="AUD">
                AUD - Australian Dollar
            </option>

            <option value="CAD">
                CAD - Canadian Dollar
            </option>

        </select>


        <button onclick="convertCurrency()">
            Convert
        </button>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
